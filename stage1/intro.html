<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Stage1 - Intro</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/movie.css">
</head>
<body>

<div class="wrapper">

    <!-- Scene 1 -->
    <div class="scene">
        <img src="../img/stage1/intro/scene1.png" class="fade-img">
        <p class="fade-text">
            風の森の奥に、小さな神殿がひっそりと佇んでいた。<br>
            中には、古い風の装置が眠っている。
        </p>
    </div>

    <!-- Scene 2 -->
    <div class="scene">
        <img src="../img/stage1/intro/scene2.png" class="fade-img">
        <p class="fade-text">
            女の子が杖を構えると、風の精霊たちがふわりと集まり、<br>
            装置の周りをくるくると舞い始めた。
        </p>
    </div>

    <!-- Scene 3 -->
    <div class="scene">
        <img src="../img/stage1/intro/scene3.png" class="fade-img">
        <p class="fade-text">
            「この装置、風の魔法で動くのかな…？」
        </p>
    </div>

    <!-- Scene 4 -->
    <div class="scene">
        <img src="../img/stage1/intro/scene4.png" class="fade-img">
        <p class="fade-text">
            風の流れを読みながら魔法を放つと、<br>
            装置がゆっくりと回転し始め、<br>
            丘の上へ続く足場が起動した。
        </p>
    </div>

    <button id="nextBtn" class="next-btn">パズルへ進む</button>

</div>

<script src="../js/storage.js"></script>
<script>
    const scenes = document.querySelectorAll(".scene");
    let index = 0;

    scenes[0].classList.add("show");

    document.body.addEventListener("click", () => {
        if (index >= scenes.length - 1) return;

        scenes[index].classList.remove("show");
        scenes[index].classList.add("hide");

        index++;
        scenes[index].classList.add("show");
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
        location.href = "game.html";
    });
</script>

</body>
</html>
