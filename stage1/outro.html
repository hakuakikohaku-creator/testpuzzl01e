<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Stage1 - Outro</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/movie.css">
</head>
<body>

<div class="wrapper">

    <!-- Scene 1 -->
    <div class="scene">
        <img src="../img/stage1/outro/scene1.png" class="fade-img">
        <p class="fade-text">
            足場に乗って上へ上へと運ばれていくと、<br>
            目の前がぱっと開けた。
        </p>
    </div>

    <!-- Scene 2 -->
    <div class="scene">
        <img src="../img/stage1/outro/scene2.png" class="fade-img">
        <p class="fade-text">
            そこには、人間の住む町を一望できる大きな丘。<br><br>
            「わぁ……こんなに遠くまで見えるんだ」
        </p>
    </div>

    <!-- Scene 3 -->
    <div class="scene">
        <img src="../img/stage1/outro/scene3.png" class="fade-img">
        <p class="fade-text">
            風がそよぎ、草原が揺れ、<br>
            女の子は思わず深呼吸した。
        </p>
    </div>

    <!-- Scene 4 -->
    <div class="scene">
        <img src="../img/stage1/outro/scene4.png" class="fade-img">
        <p class="fade-text">
            「ここ、なんだか落ち着く場所だなぁ」<br><br>
            そうつぶやきながら、しばらく景色を眺めていた。
        </p>
    </div>

    <button id="nextBtn" class="next-btn">ステージセレクトへ</button>

</div>

<script src="../js/storage.js"></script>
<script>
    const scenes = document.querySelectorAll(".scene");
    let index = 0;

    scenes[0].classList.add("show");

    document.body.addEventListener("click", () => {
        if (index >= scenes.length - 1) return;

        scenes[index].classList.remove("show");
        scenes[index].classList.add("hide");

        index++;
        scenes[index].classList.add("show");
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
        setFlag("stage1_clear");
        location.href = "../select.html";
    });
</script>

</body>
</html>
