<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Stage3 - Outro</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/movie.css">
</head>
<body>

<div class="wrapper">

    <!-- Scene 1 -->
    <div class="scene">
        <img src="../img/stage3/outro/scene1.png" class="fade-img">
        <p class="fade-text">
            浄化が完了した瞬間、<br>
            光の塔がぱあっと輝きを取り戻した。
        </p>
    </div>

    <!-- Scene 2 -->
    <div class="scene">
        <img src="../img/stage3/outro/scene2.png" class="fade-img">
        <p class="fade-text">
            その光が雲を照らし、<br>
            雲の上に広がる世界が一面に姿を現す。
        </p>
    </div>

    <!-- Scene 3 -->
    <div class="scene">
        <img src="../img/stage3/outro/scene3.png" class="fade-img">
        <p class="fade-text">
            白い雲海、虹のかかった空、<br>
            そして遠くに浮かぶ小さな島々。
        </p>
    </div>

    <!-- Scene 4 -->
    <div class="scene">
        <img src="../img/stage3/outro/scene4.png" class="fade-img">
        <p class="fade-text">
            「こんな景色、見たことない……！」<br><br>
            女の子はテラスに腰掛け、<br>
            しばらくその光景に見とれていた。
        </p>
    </div>

    <button id="nextBtn" class="next-btn">ステージセレクトへ</button>

</div>

<script src="../js/storage.js"></script>
<script>
    const scenes = document.querySelectorAll(".scene");
    let index = 0;

    scenes[0].classList.add("show");

    document.body.addEventListener("click", () => {
        if (index >= scenes.length - 1) return;

        scenes[index].classList.remove("show");
        scenes[index].classList.add("hide");

        index++;
        scenes[index].classList.add("show");
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
        setFlag("stage3_clear");
        location.href = "../select.html";
    });
</script>

</body>
</html>
