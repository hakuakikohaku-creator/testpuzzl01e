<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Stage3 - Intro</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/movie.css">
</head>
<body>

<div class="wrapper">

    <!-- Scene 1 -->
    <div class="scene">
        <img src="../img/stage3/intro/scene1.png" class="fade-img">
        <p class="fade-text">
            地図が示す最後の場所は、空に浮かぶ天空の城。<br>
            雲の上にそびえるその城は、どこか暗くよどんでいた。
        </p>
    </div>

    <!-- Scene 2 -->
    <div class="scene">
        <img src="../img/stage3/intro/scene2.png" class="fade-img">
        <p class="fade-text">
            中央には、本来は光り輝くはずの“光の塔”。<br><br>
            「この塔、光の魔法で浄化できるかも…」
        </p>
    </div>

    <!-- Scene 3 -->
    <div class="scene">
        <img src="../img/stage3/intro/scene3.png" class="fade-img">
        <p class="fade-text">
            女の子が杖を掲げると、光の粒が集まり、<br>
            塔の周りを包み込む。
        </p>
    </div>

    <!-- Scene 4 -->
    <div class="scene">
        <img src="../img/stage3/intro/scene4.png" class="fade-img">
        <p class="fade-text">
            パズルを解き、光の流れを整えていく。
        </p>
    </div>

    <button id="nextBtn" class="next-btn">パズルへ進む</button>

</div>

<script src="../js/storage.js"></script>
<script>
    const scenes = document.querySelectorAll(".scene");
    let index = 0;

    scenes[0].classList.add("show");

    document.body.addEventListener("click", () => {
        if (index >= scenes.length - 1) return;

        scenes[index].classList.remove("show");
        scenes[index].classList.add("hide");

        index++;
        scenes[index].classList.add("show");
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
        location.href = "game.html";
    });
</script>

</body>
</html>
