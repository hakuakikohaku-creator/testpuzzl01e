<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ChocoGame - 難易度選択</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrapper">
    <div id="select-container">
        <h1 class="page-title">難易度を選択</h1>

        <button class="menu-btn" onclick="selectLevel('easy')">やさしい（3×3）</button>
        <button class="menu-btn" onclick="selectLevel('normal')">ふつう（4×4）</button>
        <button class="menu-btn" onclick="selectLevel('hard')">むずかしい（5×5）</button>

        <button class="menu-btn back-btn" onclick="location.href='index.html'">戻る</button>
    </div>
</div>

<script>
function selectLevel(level) {
    localStorage.setItem("choco_level", level);
    location.href = "puzzle.html";
}
</script>
</body>
</html>
