<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ChocoGame - パズル</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrapper">
    <div id="puzzle-container">

        <!-- タイトル + 完成サムネイル -->
        <div class="puzzle-header">
            <h1 class="page-title">パズル</h1>
            <img id="puzzle-preview" class="puzzle-preview" src="">
        </div>

        <canvas id="puzzle-canvas"></canvas>

        <div id="puzzle-buttons">
            <button class="menu-btn small" id="reset-btn">リセット</button>
            <button class="menu-btn small" id="download-btn">保存</button>
            <button class="menu-btn small back-btn" id="back-btn">戻る</button>
        </div>

        <!-- フェイルセーフ -->
        <div id="error-box" style="display:none;">
            <p>画像の読み込みに失敗しました。</p>
            <button class="menu-btn" id="retry-btn">再読み込み</button>
            <button class="menu-btn back-btn" id="error-back-btn">戻る</button>
        </div>
    </div>
</div>

<script src="js/puzzle.js"></script>
</body>
</html>
