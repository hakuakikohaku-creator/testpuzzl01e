<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ChocoGame - Title</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrapper">

    <div class="title-container">
        <h1>ChocoGame</h1>
        <button id="startBtn">ゲームをはじめる</button>
    </div>

</div>

<script src="js/storage.js"></script>
<script>
    document.getElementById("startBtn").addEventListener("click", () => {

        // 初回 → プロローグ
        if (!getFlag("prologue_seen")) {
            location.href = "prologue.html";
            return;
        }

        // 2回目以降 → メニュー
        location.href = "menu.html";
    });
</script>

</body>
</html>
